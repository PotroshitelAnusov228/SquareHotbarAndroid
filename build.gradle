plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '0.1.0'
group = 'dev.squarehotbar'

base {
    archivesName = 'SquareHotbar'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
}
}

processResources {
    inputs.property 'version', project.ve
    rsion
