plugins { id 'fabric-loom' version '0.10.66' }
version = '0.1.0'
group = 'dev.squarehotbar'
archivesBaseName = 'SquareHotbar'
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.16.1'
    mappings 'net.fabricmc:yarn:1.16.1+build.21:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.11.7'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.16.2+build.385-1.16.1'
    modCompileOnly 'com.github.contariaa:SpeedrunAPI:880ace17ad'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
